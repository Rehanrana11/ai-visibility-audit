[tool.poetry]
name = "ai-visibility-audit"
version = "2.0.0"
description = "PCOS Visibility Engine MVP - auditable AI visibility runs"
authors = ["PCOS <pcos@example.com>"]
readme = "README.md"
packages = [{ include = "aivis", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
httpx = "^0.27.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
typer = ">=0.15.0,<1.0.0"
rich = "^13.7.1"
reportlab = "^4.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"

[tool.poetry.scripts]
aivis = "aivis.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

